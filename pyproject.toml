[project]
name = "hmafact"
version = "0.1.0"
description = "Hierarchical Multi-Agent Fact Verification using Dynamic Retrieval Graphs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "datasets>=2.21,<4",           # pin <4 to keep HF script-based loaders working (fallback only; M1 uses direct download for FEVER)
    "pandas>=2.2,<3",
    "pyarrow>=16,<18",
    "scikit-learn>=1.5,<2",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest-cov", "pytest-mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmafact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires network access (deselect with -m 'not live')"]

[tool.ruff]
line-length = 100
target-version = "py311"
